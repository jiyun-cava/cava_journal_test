# Builds the site and publishes it to GitHub Pages.
#  - on every push to main (your own edits)
#  - every 2 hours: checks Instagram, commits any new articles, then deploys
#  - manually from the Actions tab ("Run workflow")
name: Sync Instagram & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"   # UTC; every 2 hours at :17
  workflow_dispatch:
    inputs:
      backfill:
        description: "Import ALL Instagram posts, ignoring importAfter"
        type: boolean
        default: false

permissions:
  contents: write        # commit new posts
  pull-requests: write   # open review pull requests
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Review mode
        id: mode
        run: echo "review=$(node -p "require('./site.config.json').instagram.review || 'publish'")" >> "$GITHUB_OUTPUT"

      # Free slide reader: Tesseract OCR with the Korean model.
      - name: Cache Korean OCR model
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/tessdata
          key: tessdata-best-kor-eng-v1

      - name: Install the Korean text reader
        if: github.event_name != 'push'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr > /dev/null
          mkdir -p ~/tessdata
          for l in kor eng; do
            [ -s ~/tessdata/$l.traineddata ] || curl -sSL -o ~/tessdata/$l.traineddata \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/$l.traineddata"
          done
          echo "TESSDATA_PREFIX=$HOME/tessdata" >> "$GITHUB_ENV"
          TESSDATA_PREFIX=$HOME/tessdata tesseract --list-langs

      - name: Pull new Instagram posts
        id: sync
        if: github.event_name != 'push'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          # Optional: turns text slides into live text. Without it, posts arrive as
          # "first image + text needed" drafts.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYNC_REPORT: ${{ runner.temp }}/report.md
          REVIEW_BRANCH: instagram/${{ github.run_id }}
          REVIEW_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/instagram/${{ github.run_id }}
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::warning::INSTAGRAM_ACCESS_TOKEN secret is not set — skipping Instagram sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/sync-instagram.mjs ${{ inputs.backfill && '--all' || '' }}

      # review = "pull-request": each batch of new posts becomes a pull request.
      # An editor checks the text, fixes it if needed, and merges to publish.
      - name: Open a pull request for review
        if: steps.sync.outputs.changed == 'true' && steps.mode.outputs.review == 'pull-request'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: instagram/${{ github.run_id }}
        run: |
          git config user.name  "cava-bot"
          git config user.email "cava-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/posts src/media
          git commit -m "Instagram: ${{ steps.sync.outputs.titles }}"
          git push origin "$BRANCH"
          {
            echo "New Instagram post(s) are ready for review."
            echo
            echo "**To publish:** check the text below against the Instagram post. To fix something, open **Files changed**, click **⋯ → Edit file** on the article, save, then press **Merge pull request**. The site updates about a minute later."
            echo "**To discard:** close this pull request."
            echo
            echo "---"
            echo
            cat "${{ runner.temp }}/report.md"
          } | head -c 60000 > "${{ runner.temp }}/body.md"
          gh pr create --base main --head "$BRANCH" \
            --title "Instagram: ${{ steps.sync.outputs.titles }}" \
            --body-file "${{ runner.temp }}/body.md"
          # Remember these posts on main so they aren't picked up again.
          git checkout main
          git add instagram-state.json
          git commit -m "Instagram: mark posts as sent for review [skip ci]"
          git push origin main

      # review = "publish": publish straight away, no review.
      - name: Commit new articles
        if: steps.sync.outputs.changed == 'true' && steps.mode.outputs.review != 'pull-request'
        run: |
          git config user.name  "cava-bot"
          git config user.email "cava-bot@users.noreply.github.com"
          git add src/posts src/media instagram-state.json
          git commit -m "Instagram: add ${{ steps.sync.outputs.count }} article(s)"
          git push

      - name: Decide whether to deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.sync.outputs.changed }}" = "true" ] && [ "${{ steps.mode.outputs.review }}" != "pull-request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Pages address
        id: pages
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Build
        if: steps.decide.outputs.deploy == 'true'
        run: npx @11ty/eleventy
        env:
          ELEVENTY_RUN_MODE: build
          # github.io/<repo>/ until a custom domain is set, then the domain root
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
