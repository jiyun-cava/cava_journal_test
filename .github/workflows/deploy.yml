# Builds the site and publishes it to GitHub Pages.
#  - on every push to main (your own edits)
#  - every 2 hours: checks Instagram, commits any new articles, then deploys
#  - manually from the Actions tab ("Run workflow")
name: Sync Instagram & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"   # UTC; every 2 hours at :17
  workflow_dispatch:
    inputs:
      backfill:
        description: "Import ALL Instagram posts, ignoring importAfter"
        type: boolean
        default: false

permissions:
  contents: write   # commit new posts
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull new Instagram posts
        id: sync
        if: github.event_name != 'push'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::warning::INSTAGRAM_ACCESS_TOKEN secret is not set — skipping Instagram sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/sync-instagram.mjs ${{ inputs.backfill && '--all' || '' }}

      - name: Commit new articles
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name  "cava-bot"
          git config user.email "cava-bot@users.noreply.github.com"
          git add src/posts src/media
          git commit -m "Instagram: add ${{ steps.sync.outputs.count }} article(s)"
          git push

      - name: Decide whether to deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Pages address
        id: pages
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Build
        if: steps.decide.outputs.deploy == 'true'
        run: npx @11ty/eleventy
        env:
          ELEVENTY_RUN_MODE: build
          # github.io/<repo>/ until a custom domain is set, then the domain root
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
